name: ci

# Lint gates + build + a publish dry-run, on every push/PR. Distinct from
# publish.yml (which does a REAL npm publish on push to main) — this is the
# fast, side-effect-free correctness gate.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Lint (9 gates)
        run: npm run lint

      - name: Component docs up to date
        run: npm run lint:component-docs

      - name: Build
        run: npm run build

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: a11y audit (WCAG 2.1 AA, blocking)
        run: npm run a11y

      - name: Publish dry-run
        run: npm publish --dry-run
