name: ci

# Lint gates + build + a publish dry-run, on every push/PR. Distinct from
# publish.yml (which does a REAL npm publish on push to main) — this is the
# fast, side-effect-free correctness gate.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # >= 22 for the global WebSocket the CDP client in scripts/cdp.mjs
          # uses — that is what lets the a11y and visual gates drive a browser
          # with no puppeteer/playwright dependency (see AGENTS.md).
          node-version: '22'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Lint (15 gates)
        run: npm run lint

      - name: Component docs up to date
        run: npm run lint:component-docs

      # The shipped TypeScript declarations are generated from the same
      # component-surface extraction as the docs above. This fails the build
      # when types/*.d.ts no longer matches the real signatures — without it a
      # signature change would silently ship a `types` entry that lies about
      # the runtime surface, which is worse for a consumer than no types.
      - name: Component types up to date
        run: npm run lint:component-types

      # The interactive component explorer (ui_kits/component_explorer/) reads
      # this manifest at runtime; it is generated from the same extraction as
      # the two checks above, so a signature change that isn't reflected here
      # would silently ship a stale explorer showing an old prop table.
      - name: Component manifest up to date
        run: npm run lint:component-manifest

      - name: Build
        run: npm run build

      # The browser-driven gates below talk CDP to an ALREADY-RUNNING Chrome.
      # Starting the browser and the static server is this workflow's job, not
      # a script's — that is what keeps scripts/*.mjs free of any
      # puppeteer/playwright dependency or in-script browser launch, per
      # AGENTS.md. ubuntu-latest ships Chrome preinstalled, so nothing is
      # installed here either.
      - name: Start static server and headless Chrome
        run: |
          npx --yes http-server . -p 8899 -s &
          google-chrome --headless=new --disable-gpu --no-sandbox \
            --remote-debugging-port=9333 --remote-debugging-address=127.0.0.1 \
            --hide-scrollbars --force-device-scale-factor=1 about:blank &
          npx --yes wait-on http://127.0.0.1:8899/preview/index.html http-get://127.0.0.1:9333/json/version

      - name: Accessibility audit (axe-core, WCAG 2.1 AA)
        run: node scripts/a11y-audit.mjs

      # Non-blocking on purpose, and this is not a hedge -- it is what the
      # comparison can actually prove. The committed baselines are PNGs, and
      # text rasterization differs between the platform that captured them and
      # this runner: a full re-capture on Windows drifted 78 of 81 pages here,
      # every failing page a type specimen, at sub-3% deltas with no layout
      # change. That is a font-metric difference, not a regression, and no
      # tolerance separates the two reliably -- raising it far enough to absorb
      # cross-platform rasterization would also absorb the real single-element
      # shifts the gate exists to catch.
      #
      # So the gate stays honest instead of green: it is authoritative when run
      # against baselines captured on the SAME platform (which is how it caught
      # the 40000-pixel injected block and the data-density layout shift during
      # development), and here it reports. Making it blocking cross-platform
      # would mean re-freezing on every run, which is a gate that cannot fail.
      #
      # The real fix is committing baselines captured on THIS platform, and that
      # now exists: run the `refresh visual baselines` workflow
      # (.github/workflows/visual-baselines.yml, manual dispatch) to recapture on
      # ubuntu-latest and commit the result. Once the committed PNGs are
      # Linux-native, this step can drop continue-on-error and become blocking.
      # Do NOT recapture on a developer machine to make this green — that is the
      # 78-of-81 case above, and it makes the check strictly less informative.
      - name: Visual regression (report-only across platforms — see comment)
        continue-on-error: true
        run: node scripts/visual-baseline.mjs check

      - name: Publish dry-run
        run: npm publish --dry-run
