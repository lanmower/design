// --- Minimal WM (mirrors thebird's docs/wm.js but stripped to essentials) ---
function createMockWM() {
  let root = document.getElementById('wm-root');
  if (!root) { root = document.createElement('div'); root.id = 'wm-root'; root.className = 'wm-root'; document.body.appendChild(root); }
  const windows = new Map();
  let z = 100, focused = null, nextId = 1;
  function focus(id) {
    const w = windows.get(id); if (!w) return;
    if (focused && focused !== id) { const p = windows.get(focused); if (p) p.handle.setFocused(false); }
    focused = id; w.handle.setFocused(true); w.handle.setZIndex(++z); w.z = z;
  }
  function open({ title='window', x=80, y=70, width=520, height=360, body=null, kind='div', instanceId='' } = {}) {
    const id = 'w' + (nextId++);
    const state = { minimized:false, maximized:false };
    const handle = renderWindow({
      title, body, kind, instanceId,
      bounds: { x, y, w:width, h:height },
      focused: false,
      callbacks: {
        onFocus: () => focus(id),
        onClose: () => close(id),
        onMinimize: () => { state.minimized = !state.minimized; handle.setMinimized(state.minimized); },
        onMaximize: () => { state.maximized = !state.maximized; handle.setMaximized(state.maximized); },
        onDragStart: (e, frame) => {
          const sx=e.clientX, sy=e.clientY, ox=frame.x, oy=frame.y; e.preventDefault();
          const mv = ev => handle.setBounds({ x: ox+ev.clientX-sx, y: oy+ev.clientY-sy });
          const up = () => { document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); };
          document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up);
        },
        onResizeStart: (e, frame) => {
          const sx=e.clientX, sy=e.clientY, ow=frame.w, oh=frame.h; e.preventDefault();
          const mv = ev => handle.setBounds({ w: Math.max(220, ow+ev.clientX-sx), h: Math.max(140, oh+ev.clientY-sy) });
          const up = () => { document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); };
          document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up);
        },
      },
    });
    root.appendChild(handle.el);
    const w = { id, handle, get el(){return handle.el;}, get titleEl(){return handle.el.querySelector('.wm-title');}, kind, instanceId, z:0, get minimized(){return state.minimized;}, get maximized(){return state.maximized;} };
    windows.set(id, w); focus(id); return w;
  }
  function close(id) { const w = windows.get(id); if (!w) return; w.handle.dispose(); windows.delete(id); if (focused===id) focused=null; }
  function list() { return [...windows.values()].map(w => ({ id:w.id, title:w.titleEl ? w.titleEl.textContent : '', kind:w.kind, focused: w.id===focused, z:w.z, minimized:w.minimized, maximized:w.maximized })); }
  return { open, close, focus, list, get focused(){return focused;}, get count(){return windows.size;} };
}

// --- Mock fs (for files-app and freddie-dashboard.os-fs) ---
const mockFiles = {

};
const mockFs = {
  list: async () => Object.keys(mockFiles),
  readFile: async (p) => mockFiles[p] || '',
};

  ['creative/copywriting',              { name:'creative/copywriting',              category:'creative',              shortName:'copywriting', description:'Produce on-brand copy.' }],

  ['research/library',                  { name:'research/library',                  category:'research',              shortName:'library',     description:'Bibliographic + canonical-source lookup.' }],
  ['data/profile',                      { name:'data/profile',                      category:'data',                  shortName:'profile',     description:'Schema and quality profiling.' }],

  ['write',   { name:'write',   toolset:'fs',     description:'write a file' }],

  ['delegate',{ name:'delegate',toolset:'core',   description:'spawn a sub-agent' }],
]);
const mockHost = {
  kind: 'freddie-host',
  version: 'demo-0.0.0',
  pi: {
    tools: mockTools,
    skills: mockSkills,
    sessions: { list: async () => [
      { id:'sess-aaa1bbbb', title:'review the wm refactor', platform:'cli', model:'claude/sonnet', cwd:'/home/demo/proj', skill:'software-development/code-review' },
      { id:'sess-cccc2222', title:'plan migration pass G',  platform:'cli', model:'claude/opus',   cwd:'/home/demo/proj', skill:'planning/breakdown' },
      { id:'sess-3333dddd', title:'etl daily metrics',      platform:'cron',model:'claude/haiku',  cwd:'/home/demo/etl',  skill:'data/etl' },
    ], getMessages: async () => [] },
    projects: { list: () => [{ name:'demo', path:'/home/demo' }], active: () => ({ name:'demo', path:'/home/demo' }) },
    cron:    { list: async () => [{ id:'c1', cron:'*/15 * * * *', prompt:'tail logs', enabled:true }] },
    config:  { load: async () => ({ agent:{ provider:'acptoapi', model:'claude/sonnet', max_iterations:8, max_tokens:4096, temperature:0.2 }, _config_version:3 }), saveValue: async ()=>{} },
    profiles:{ list: () => [{ name:'default' }] },
    commands:{ list: () => [{ name:'/help', category:'core', description:'list commands' }, { name:'/skills', category:'core', description:'list skills' }] },
    env:     { list: () => [{ key:'OPENAI_API_KEY', set:false }, { key:'ANTHROPIC_API_KEY', set:true }, { key:'ACPTOAPI_BASE_URL', set:true }] },
    health:  () => ({ ok:true, uptime:'0m (demo)' }),
    debug:   () => ({ note:'mock host — demo only' }),
    agents:  async () => ({ count:0, turns:0, active:null }),
    batch:   { run: async () => ({ ok:true, results:[] }) },
    gateway: { platforms: () => [{ name:'cli', enabled:true, note:'local' }] },

// --- Mock registry (apps used by createDesktopShell) ---
const registry = {
  list: () => [
    { id:'chat',      name:'chat',      icon:'',  defaultSize:{ w:560, h:420 }, factory: () => {
        const node = document.createElement('freddie-chat');
        node.setAttribute('title', 'freddie · demo');
        node.setAttribute('placeholder', 'message freddie · /tools · /run … (demo, no backend)');
        // Pre-populate mock thread once connected.
        setTimeout(() => {
          node.messages = [
            { role:'user',      content:'hey freddie, can you review the new wm refactor?' },
            { role:'assistant', content:'Sure — point me at the diff. I\'ll check focus order, drag/resize math, and dispose paths.' },
            { role:'user',      content:'main change is moving renderWindow upstream and keeping createWM thin.' },
            { role:'assistant', content:'Good seam. Watch for double-dispose: handle.dispose() must be idempotent so close() during a drag-pointer-up doesn\'t double-fire.' },
          ];
        }, 50);
        return { node };
    } },
    { id:'freddie',   name:'freddie',   icon:'',  defaultSize:{ w:780, h:520 }, factory: () => createFreddieDashboard({
        instance:{ id:'demo-1', host:mockHost, fs:mockFs },
        osSurfaces: {
          instances: () => [{ id:'demo-1', shells:[{}], windows:[{}] }, { id:'demo-2', shells:[], windows:[] }],
          activeInstanceId: () => 'demo-1',
          wm: { list: () => [{ id:'w1', title:'chat · demo' }, { id:'w2', title:'freddie · demo' }, { id:'w3', title:'files · demo' }, { id:'w4', title:'monitor · demo' }], focused: { id:'w2', title:'freddie · demo' } },
          xServer: () => ({ windows:0, pixmaps:0, gcs:0, atoms:65, cursors:0 }),
        },
    }) },
    { id:'files',     name:'files',     icon:'',  defaultSize:{ w:480, h:340 }, factory: () => renderFilesApp({ list: mockFs.list, readFile: mockFs.readFile, label:'demo-1', pollMs:0 }) },
    { id:'monitor',   name:'monitor',   icon:'',  defaultSize:{ w:360, h:220 }, factory: () => renderMonitorApp({ getStats: () => ({ instanceId:'demo-1', frames:60, shells:1, windows:4, appsRegistered:4, jsHeapMb:12.4, jsHeapLimitMb:2048, time:new Date().toLocaleTimeString() }), pollMs:1000 }) },
    { id:'terminal',  name:'terminal',  icon:'',  defaultSize:{ w:560, h:340 }, factory: () => {
        const t = renderTerminal({ title:'demo-1:term', statusText:'mock — no xterm wired' });

        pre.style.cssText = 'margin:0;padding:8px;font:12px var(--os-mono,monospace);color:var(--os-fg);white-space:pre-wrap;';
        pre.textContent = '$ ls -la\ndrwxr-xr-x  3 user user  96 May 11 10:00 .\ndrwxr-xr-x 11 user user 352 May 11 09:58 ..\n-rw-r--r--  1 user user 128 May 11 10:00 notes.md\n$ ';
        t.slot.appendChild(pre);
        return t;
    } },
    { id:'browser',   name:'browser',   icon:'',  defaultSize:{ w:640, h:420 }, factory: () => {
        const b = renderBrowserPane({ initialUrl:'about:blank', callbacks:{ onNavigate: u => alert('demo: would navigate to ' + u), onReload: () => alert('demo: reload'), onBack: () => alert('demo: back'), onForward: () => alert('demo: forward') } });
        const iframe = document.createElement('iframe');
        iframe.style.cssText = 'border:none;width:100%;height:100%;background:var(--os-bg-0);';
        iframe.srcdoc = '<html><body style="font-family:Nunito,sans-serif;padding:16px;"><h2>demo iframe</h2><p>browser-app chrome paints; consumer supplies the iframe.</p></body></html>';
        b.slot.appendChild(iframe);
        b.setStatus('ready');
        return b;
    } },
    { id:'validator', name:'validator', icon:'',  defaultSize:{ w:520, h:380 }, factory: () => {
        const v = renderValidator({ results:{ allGreen:true, passed:124, total:124, ms:12800 }, callbacks:{ onRerun: () => alert('demo: rerun') } });
        const stub = document.createElement('div');
        stub.style.cssText = 'padding:16px;font-family:var(--os-mono,monospace);font-size:11px;color:var(--os-fg-2);';
        stub.textContent = 'demo validator slot — consumer mounts iframe to /validate.html in production.';
        v.slot.appendChild(stub);
        return v;
    } },
  ],
  get: (id) => registry.list().find(a => a.id === id),
};

// --- Boot ---
const wm = createMockWM();
const shell = createDesktopShell({ root: document.body, wm, registry, brand:'247420 · demo' });

const dock = renderDock({
  root: document.body,
  callbacks: {
    onNewInstance: () => alert('demo: new instance is mocked'),
    onSelectInstance: (id) => dock.setActive(id),
    onCloseInstance: (id) => alert('demo: would close ' + id),
  },
});
dock.setInstances([
  { id:'demo-1', label:'demo-1', active:true },
  { id:'demo-2', label:'demo-2', active:false },
]);
dock.setActive('demo-1');

// Open the four windows
shell.openApp('chat');
shell.openApp('freddie');
shell.openApp('files');
shell.openApp('monitor');
shell.openApp('terminal');
shell.openApp('browser');
shell.openApp('validator');

// --- Self-test ---
setTimeout(() => {
  const errors = [];
  const log = (msg) => errors.push(msg);
  window.addEventListener('error', (e) => log('error: ' + e.message));

  const checks = {
    chrome_menubar:        !!document.querySelector('.os-menubar'),
    taskbar_present:       !!document.querySelector('.os-taskbar'),
    at_least_3_windows:    document.querySelectorAll('.wm-win').length >= 3,
    freddie_chat_defined:  !!customElements.get('freddie-chat'),
    dock_two_buttons:      document.querySelectorAll('.launcher-instances .launcher-btn[data-role="select"]').length === 2,
    terminal_app_present:  !!document.querySelector('[data-component="terminal-app"]'),
    browser_app_present:   !!document.querySelector('[data-component="browser-app"]'),
    validator_app_present: !!document.querySelector('[data-component="validator-app"]'),
  };
  const passed = Object.values(checks).filter(Boolean).length;
  const total  = Object.keys(checks).length;
  const allGreen = passed === total;
  window.__demoResults = { allGreen, passed, total, checks, errors };
  const el = document.getElementById('demo-results');
  el.textContent = (allGreen ? 'OK ' : 'FAIL ') + passed + '/' + total + (errors.length ? ' · ' + errors.length + ' errors' : '');
  el.style.color = allGreen ? 'var(--panel-accent,#3F8A4A)' : '#b00020';
}, 800);
</script>
