    - colors-core
    - colors-lore
    - colors-semantic
    - dateline
    - dropzone
    - file-grid
    - file-row
    - file-toolbar
    - file-viewer
    - header
    - icons-unicode
    - index-row
    - inputs
    - manifesto
    - rules
    - spacing
    - stamps
    - stamps-lore
    - theme-ink
    - type-display
    - type-mono
    - type-prose
    - type-scale
    - wordmarks

file_browser:
  heading: "file browser"
  count: "primitives"
  items:
    - { code: "fb", title: "file_browser kit",   sub: "drop, list, preview, dialogs",   desc: "the full surface, working with mock data",  href: "./ui_kits/file_browser/", cta: "open ->" }
    - { code: "fb", title: "FileRow",            sub: "rail icon name meta",      desc: "data-file-type drives the rail color — never apply rail-* manually", href: "./preview/file-row.html", cta: "open ->" }
    - { code: "fb", title: "FileGrid",           sub: "stack of rows in a panel",       desc: "directories sort first; selected row gets the mint .active tone", href: "./preview/file-grid.html", cta: "open ->" }
    - { code: "fb", title: "DropZone",           sub: "tonal upload target",            desc: "swap to --panel-select on dragover; preventDefault on document, not just zone", href: "./preview/dropzone.html", cta: "open ->" }
    - { code: "fb", title: "FileViewer",         sub: "modal preview keyed head",     desc: "head + body both carry data-file-type so rails propagate inside the modal", href: "./preview/file-viewer.html", cta: "open ->" }
    - { code: "fb", title: "FileToolbar",        sub: "actions breadcrumb upload",  desc: "left-aligned actions, right-aligned count; UploadProgress sits underneath", href: "./preview/file-toolbar.html", cta: "open ->" }
    - { code: "fb", title: "fsbrowse",           sub: "Express + busboy backend",       desc: "canonical real-world wiring — same SDK, real filesystem operations",     href: "https://github.com/AnEntrypoint/fsbrowse", cta: "source" }

quickstart:
  heading: "quick start"
  lines:
    - { kind: "cmt", text: "# install via importmap (no bundler)" }
    - { kind: "cmd", text: "<script type='importmap'>{\"imports\":{\"anentrypoint-design\":\"https://unpkg.com/anentrypoint-design@latest/dist/247420.js\"}}</script>" }
    - { kind: "cmt", text: "# or clone the source" }
    - { kind: "cmd", text: "git clone https://github.com/AnEntrypoint/design.git" }

desktop_os:
  heading: "Desktop OS shell"
  count: "in-page window manager"
  items:
    - { code: "os", title: "Live demo",           sub: "menubar, apps drawer, side rail, taskbar, floating windows", desc: "a runnable desktop shell with its own window manager and a 2-app registry",   href: "./ui_kits/os/",   cta: "open ->" }
    - { code: "os", title: "createDesktopShell",  sub: "menubar, apps launcher, taskbar, window manager",  desc: "mount any app registry into a draggable, resizable window manager",   href: "https://github.com/AnEntrypoint/design/blob/main/src/kits/os/shell.js",   cta: "shell.js" }
    - { code: "os", title: "renderWindow / renderDock", sub: "pure paint-surface primitives",  desc: "the window chrome and dock rendering the shell composes, importable standalone", href: "https://github.com/AnEntrypoint/design/blob/main/src/kits/os/wm.js", cta: "wm.js" }
    - { code: "os", title: "Icon set",            sub: "SVG glyphs for menubar and taskbar",                    desc: "home, apps, search, settings — used by the shell and exposed for apps",   href: "https://github.com/AnEntrypoint/design/blob/main/src/kits/os/icons.js",   cta: "icons.js" }
    - { code: "os", title: "theme.css",           sub: "OS chrome tokens: menubar, launcher, window manager",          desc: "scoped CSS module loaded by the shell — keeps desktop visuals isolated",  href: "https://github.com/AnEntrypoint/design/blob/main/src/kits/os/theme.css", cta: "theme.css" }
    - { code: "os", title: "Import path",         sub: "anentrypoint-design/kits/os",                         desc: "subpath export, no bundler needed — pulls icons, shell, and every app paint surface",    href: "https://github.com/AnEntrypoint/design/blob/main/package.json",          cta: "exports" }

web_components:
  heading: "web components"
  count: "1 element"
  items:
    - { code: "wc", title: "<ds-chat>",           sub: "auto-registers when the sdk loads in a browser", desc: "set el.messages = [...] or pass json via attribute; listen for 'send' event",      href: "https://github.com/AnEntrypoint/design/blob/main/src/web-components/ds-chat.js", cta: "ds-chat.js" }
    - { code: "wc", title: "registerChatElement", sub: "manual register helper",                         desc: "exported from the sdk root for ssr / late-mount when customElements is gated",     href: "https://github.com/AnEntrypoint/design/blob/main/src/index.js",                  cta: "source" }

api_exports:
  heading: "public api"
  count: "sdk surface"
  items:
    - { code: "api", title: "h / applyDiff",                  sub: "webjsx createElement + diff",       desc: "build vnodes with h(), render with applyDiff(root, [vnode]) — no jsx pragma needed",       href: "https://github.com/AnEntrypoint/design/blob/main/src/index.js",      cta: "index.js" }
    - { code: "api", title: "installStyles / scope",          sub: "ds-247420 css scope + bootstrap",   desc: "installStyles() injects the prefixed css; scope = '.ds-247420' for selector composition",  href: "https://github.com/AnEntrypoint/design/blob/main/src/styles.js",     cta: "styles.js" }
    - { code: "api", title: "loadCss",                        sub: "fetch the bundled css string",      desc: "useful for shadow roots or custom style injection paths",                                  href: "https://github.com/AnEntrypoint/design/blob/main/src/styles.js",     cta: "styles.js" }
    - { code: "api", title: "mount / mountKit",               sub: "ds shell + ui_kit bootstrap",       desc: "mount(root, viewFn) wires applyDiff + motion; mountKit({root,view,screen}) wires a kit",   href: "https://github.com/AnEntrypoint/design/blob/main/src/bootstrap.js",  cta: "bootstrap.js" }
    - { code: "api", title: "registerDeckStage / getDeckStage", sub: "16:9 deck stage api",             desc: "register custom deck stages and fetch the active stage for slide transitions",             href: "https://github.com/AnEntrypoint/design/blob/main/src/deck-stage.js", cta: "deck-stage.js" }
    - { code: "api", title: "renderMarkdown",                 sub: "marked v15 + dompurify lazy stack", desc: "lazy-loads marked + dompurify from jsdelivr; only xss gate for chat html",                 href: "https://github.com/AnEntrypoint/design/blob/main/src/markdown.js",   cta: "markdown.js" }
    - { code: "api", title: "ensurePrism / highlightAllUnder", sub: "prism core + per-language",         desc: "injects prism on first use; CodeNode ref-callback highlights inside any subtree",         href: "https://github.com/AnEntrypoint/design/blob/main/src/highlight.js",  cta: "highlight.js" }
    - { code: "api", title: "renderPageHtml",                 sub: "static page html template",         desc: "shared head/body wrapper for kit pages — meta, importmap, ds-247420 scope",                href: "https://github.com/AnEntrypoint/design/blob/main/src/page-html.js",  cta: "page-html.js" }
    - { code: "api", title: "components / motion / debug",    sub: "namespaces from the default export", desc: "components.* are the C.* primitives; motion.animateTree, debug.window.__debug registry",  href: "https://github.com/AnEntrypoint/design/blob/main/src/components.js", cta: "components.js" }

features:
  heading: "Why teams choose 247420"
  items:
    - { name: "Clear visual hierarchy", desc: "Panel-on-panel layering keeps dense dashboards scannable — important content stays legible even in complex, data-heavy screens.", href: "https://github.com/AnEntrypoint/design/blob/main/src/css/app-shell/panel-row.css", cta: "panel-row.css" }
    - { name: "Readable at a glance",   desc: "A disciplined type system reserves monospace for codes and labels and sans-serif for everything meant to be read, so interfaces stay legible under real workloads.", href: "https://github.com/AnEntrypoint/design/blob/main/colors_and_type.css", cta: "colors_and_type.css" }
    - { name: "Instant status recognition", desc: "Color-coded indicator rails let users scan for status and category at a glance, without relying on borders that add visual noise.", href: "https://github.com/AnEntrypoint/design/blob/main/src/css/app-shell/panel-row.css#L126", cta: "panel-row.css" }
    - { name: "Rebrand in minutes, not sprints", desc: "Every surface, type scale, and accent color is driven entirely by design tokens — retheme an entire product by editing one file, with zero component code changes.", href: "https://github.com/AnEntrypoint/design/blob/main/colors_and_type.css", cta: "colors_and_type.css" }
    - { name: "Accessible by default", desc: "Every kit is WCAG AA verified (0 blocking violations across all 21 surfaces), with shared focus-visible tokens, skip links, and correct ARIA roles built into every component.", href: "https://github.com/AnEntrypoint/design/blob/main/docs/a11y-report.md", cta: "a11y-report.md" }

status_left:
  - "main"
  - "utf-8"
  - "lf"
# theme.mjs overwrites this with the real published SDK version + live kit
# count (14 surfaces, from home.kits.items.length) rather than the static
# fallback strings below, which only render if that lookup ever fails.
status_right:
  - "anentrypoint-design"
  - "14 kits"
