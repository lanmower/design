id: home
title: Home

hero:
  heading: "design"
  subheading: "the 247420 design system"
  body: "14 kit surfaces, 25 previews, one deck, and a full desktop-OS shell — plus a web component and an SDK, all tokens-only, zero raw color literals, one importmap script tag to install. every panel, row, and form control in this system reads its color, radius, and spacing from a single token file — swap the tokens and every surface built on them changes with it."
  badges:
    - { label: "design-system" }
    - { label: "tokens" }
    - { label: "web" }
  ctas:
    - { label: "GitHub", href: "https://github.com/AnEntrypoint/design", primary: true }
    - { label: "247420", href: "https://247420.xyz" }

sidebar:
  fab:
    label: "open"
    glyph: "+"
    href: "./ui_kits/homepage/"
  # `count` here is a fallback only -- site/theme.mjs::withRealCounts()
  # overwrites it at render time from the real kits/decks/previews/docs
  # arrays below for any row whose href is in COUNT_SOURCE_BY_HREF, so a
  # hand-typed number here can never drift out of sync with what the
  # matching panel actually renders.
  bins:
    - { label: "everything", href: "#all", active: true }
    - { label: "pinned",     href: "#kits" }
    - { label: "shipped",    href: "#previews" }
    - { label: "drafts",     href: "#decks" }
  labels_group: "labels"
  labels:
    - { label: "ui kits",  href: "#kits" }
    - { label: "decks",    href: "#decks" }
    - { label: "previews", href: "#previews" }
    - { label: "docs",     href: "#docs" }
  more_group: "more"
  more:
    - { label: "readme",  href: "https://github.com/AnEntrypoint/design/blob/main/README.md" }
    - { label: "skill",   href: "https://github.com/AnEntrypoint/design/blob/main/SKILL.md" }
    - { label: "tokens",  href: "https://github.com/AnEntrypoint/design/blob/main/colors_and_type.css" }
    - { label: "source",  href: "https://github.com/AnEntrypoint/design" }
    - { label: "MIT license", href: "https://github.com/AnEntrypoint/design/blob/main/LICENSE" }

tabs:
  - { label: "everything", href: "#all", active: true }
  - { label: "kits",       href: "#kits" }
  - { label: "decks",      href: "#decks" }
  - { label: "previews",   href: "#previews" }

kits:
  heading: "ui kits"
  count: "14 surfaces"
  items:
    - { code: "01", title: "homepage",     sub: "marquee + works grid",                  desc: "opens with an editorial banner over a quiet works-grid shell",                href: "./ui_kits/homepage/" }
    - { code: "02", title: "project page", sub: "hero receipt install changelog",  desc: "ships a full case-study template — hero, receipt, install, changelog",                      href: "./ui_kits/project_page/" }
    - { code: "03", title: "docs",         sub: "long-form prose chrome",                desc: "wraps long-form prose in sidebar nav, mono headings, and code blocks",            href: "./ui_kits/docs/" }
    - { code: "04", title: "blog",         sub: "dated index + reading view",            desc: "lists dated posts with author bylines and a distraction-free reading view",                            href: "./ui_kits/blog/" }
    - { code: "05", title: "chat",         sub: "message thread + composer",             desc: "threads messages through pill bubbles with monospace timestamps and a room sidebar",   href: "./ui_kits/chat/" }
    - { code: "06", title: "aicat",        sub: "ai assistant with cat persona",         desc: "animates an ascii cat portrait through thinking dots and a mood-swapping face",  href: "./ui_kits/aicat/" }
    - { code: "07", title: "file browser", sub: "rails by file type drop preview",   desc: "wires every file-row primitive to a static demo backed by fsbrowse", href: "./ui_kits/file_browser/" }
    - { code: "08", title: "dashboard",    sub: "kpis tables receipts changelog",  desc: "tracks kpis, tables, and receipts with a running changelog in one operations surface", href: "./ui_kits/dashboard/" }
    - { code: "09", title: "terminal",     sub: "cli prompt command lines log view", desc: "renders five line kinds (cmt cmd out ok warn) over a tonal log panel", href: "./ui_kits/terminal/" }
    - { code: "10", title: "settings",     sub: "sectioned forms toggles save bar",  desc: "covers every input primitive — fields, segmented buttons, danger panel", href: "./ui_kits/settings/" }
    - { code: "11", title: "signin",       sub: "auth providers magic link",         desc: "authenticates through a narrow tone-on-tone form, no shadows, no spinners", href: "./ui_kits/signin/" }
    - { code: "12", title: "search",       sub: "topbar query faceted filters rows", desc: "ranks results through faceted filters, reusing the same RowLink primitive every list does", href: "./ui_kits/search/" }
    - { code: "13", title: "404",          sub: "empty-state hero suggested routes",   desc: "greets dead links with an oversized mono code and three recovery CTAs",      href: "./ui_kits/error_404/" }
    - { code: "14", title: "gallery",      sub: "visual grid tonal cards lightbox",  desc: "arranges tiles on shared panel tokens and opens them in a matching lightbox", href: "./ui_kits/gallery/" }

decks:
  heading: "decks"
  items:
    - { code: "01", title: "deck template", sub: "16:9 stage with auto-fit", desc: "title, lede, code, comparison, manifesto", href: "./slides/" }

docs:
  heading: "docs"
  items:
    - { code: "md",  title: "readme", sub: "overview, manifesto, conventions",   desc: "start here",                          href: "https://github.com/AnEntrypoint/design/blob/main/README.md" }
    - { code: "md",  title: "skill",  sub: "authoring rules for the agent",      desc: "editorial zine surface modes",    href: "https://github.com/AnEntrypoint/design/blob/main/SKILL.md" }
    - { code: "css", title: "tokens", sub: "colors, type, panel surface tokens", desc: "canonical source of truth",           href: "https://github.com/AnEntrypoint/design/blob/main/colors_and_type.css" }
    - { code: "md",  title: "component props", sub: "generated prop reference", desc: "every exported component's signature and documented params", href: "https://github.com/AnEntrypoint/design/blob/main/docs/component-props.md" }
    - { code: "md",  title: "changelog", sub: "release history", desc: "what shipped in each published version", href: "https://github.com/AnEntrypoint/design/blob/main/CHANGELOG.md" }

previews:
  heading: "previews"
  base: "./preview/"
  items:
    - buttons
    - colors-core
    - colors-lore
    - colors-semantic
    - dateline
    - dropzone
    - file-grid
    - file-row
    - file-toolbar
    - file-viewer
    - header
    - icons-unicode
    - index-row
    - inputs
    - manifesto
    - rules
    - spacing
    - stamps
    - stamps-lore
    - theme-ink
    - type-display
    - type-mono
    - type-prose
    - type-scale
    - wordmarks

file_browser:
  heading: "file browser"
  count: "primitives"
  items:
    - { code: "fb", title: "file_browser kit",   sub: "drop, list, preview, dialogs",   desc: "the full surface, working with mock data",  href: "./ui_kits/file_browser/", cta: "open ->" }
    - { code: "fb", title: "FileRow",            sub: "rail icon name meta",      desc: "data-file-type drives the rail color — never apply rail-* manually", href: "./preview/file-row.html", cta: "open ->" }
    - { code: "fb", title: "FileGrid",           sub: "stack of rows in a panel",       desc: "directories sort first; selected row gets the mint .active tone", href: "./preview/file-grid.html", cta: "open ->" }
    - { code: "fb", title: "DropZone",           sub: "tonal upload target",            desc: "swap to --panel-select on dragover; preventDefault on document, not just zone", href: "./preview/dropzone.html", cta: "open ->" }
    - { code: "fb", title: "FileViewer",         sub: "modal preview keyed head",     desc: "head + body both carry data-file-type so rails propagate inside the modal", href: "./preview/file-viewer.html", cta: "open ->" }
    - { code: "fb", title: "FileToolbar",        sub: "actions breadcrumb upload",  desc: "left-aligned actions, right-aligned count; UploadProgress sits underneath", href: "./preview/file-toolbar.html", cta: "open ->" }
    - { code: "fb", title: "fsbrowse",           sub: "Express + busboy backend",       desc: "canonical real-world wiring — same SDK, real filesystem operations",     href: "https://github.com/AnEntrypoint/fsbrowse", cta: "source" }

quickstart:
  heading: "quick start"
  lines:
    - { kind: "cmt", text: "# install via importmap (no bundler)" }
    - { kind: "cmd", text: "<script type='importmap'>{\"imports\":{\"anentrypoint-design\":\"https://unpkg.com/anentrypoint-design@latest/dist/247420.js\"}}</script>" }
    - { kind: "cmt", text: "# or clone the source" }
    - { kind: "cmd", text: "git clone https://github.com/AnEntrypoint/design.git" }

desktop_os:
  heading: "desktop os shell"
  count: "in-page wm"
  items:
    - { code: "os", title: "createDesktopShell", sub: "menubar apps launcher taskbar window manager",  desc: "in-page desktop OS chrome — mount any app registry into a draggable wm",   href: "https://github.com/AnEntrypoint/design/blob/main/src/desktop/shell.js",   cta: "shell.js" }
    - { code: "os", title: "icons set",          sub: "svg glyphs for menubar + taskbar",                    desc: "home, apps, search, settings — used by the shell and exposed for apps",   href: "https://github.com/AnEntrypoint/design/blob/main/src/desktop/icons.js",   cta: "icons.js" }
    - { code: "os", title: "theme.css",          sub: "os chrome tokens menubar launcher wm",          desc: "scoped css module loaded by the shell — keeps desktop visuals isolated",  href: "https://github.com/AnEntrypoint/design/blob/main/src/desktop/theme.css", cta: "theme.css" }
    - { code: "os", title: "import path",        sub: "anentrypoint-design/desktop",                         desc: "subpath export; no bundler needed — pulls icons + createDesktopShell",    href: "https://github.com/AnEntrypoint/design/blob/main/package.json",          cta: "exports" }

web_components:
  heading: "web components"
  count: "1 element"
  items:
    - { code: "wc", title: "<ds-chat>",           sub: "auto-registers when the sdk loads in a browser", desc: "set el.messages = [...] or pass json via attribute; listen for 'send' event",      href: "https://github.com/AnEntrypoint/design/blob/main/src/web-components/ds-chat.js", cta: "ds-chat.js" }
    - { code: "wc", title: "registerChatElement", sub: "manual register helper",                         desc: "exported from the sdk root for ssr / late-mount when customElements is gated",     href: "https://github.com/AnEntrypoint/design/blob/main/src/index.js",                  cta: "source" }

api_exports:
  heading: "public api"
  count: "sdk surface"
  items:
    - { code: "api", title: "h / applyDiff",                  sub: "webjsx createElement + diff",       desc: "build vnodes with h(), render with applyDiff(root, [vnode]) — no jsx pragma needed",       href: "https://github.com/AnEntrypoint/design/blob/main/src/index.js",      cta: "index.js" }
    - { code: "api", title: "installStyles / scope",          sub: "ds-247420 css scope + bootstrap",   desc: "installStyles() injects the prefixed css; scope = '.ds-247420' for selector composition",  href: "https://github.com/AnEntrypoint/design/blob/main/src/styles.js",     cta: "styles.js" }
    - { code: "api", title: "loadCss",                        sub: "fetch the bundled css string",      desc: "useful for shadow roots or custom style injection paths",                                  href: "https://github.com/AnEntrypoint/design/blob/main/src/styles.js",     cta: "styles.js" }
    - { code: "api", title: "mount / mountKit",               sub: "ds shell + ui_kit bootstrap",       desc: "mount(root, viewFn) wires applyDiff + motion; mountKit({root,view,screen}) wires a kit",   href: "https://github.com/AnEntrypoint/design/blob/main/src/bootstrap.js",  cta: "bootstrap.js" }
    - { code: "api", title: "registerDeckStage / getDeckStage", sub: "16:9 deck stage api",             desc: "register custom deck stages and fetch the active stage for slide transitions",             href: "https://github.com/AnEntrypoint/design/blob/main/src/deck-stage.js", cta: "deck-stage.js" }
    - { code: "api", title: "renderMarkdown",                 sub: "marked v15 + dompurify lazy stack", desc: "lazy-loads marked + dompurify from jsdelivr; only xss gate for chat html",                 href: "https://github.com/AnEntrypoint/design/blob/main/src/markdown.js",   cta: "markdown.js" }
    - { code: "api", title: "ensurePrism / highlightAllUnder", sub: "prism core + per-language",         desc: "injects prism on first use; CodeNode ref-callback highlights inside any subtree",         href: "https://github.com/AnEntrypoint/design/blob/main/src/highlight.js",  cta: "highlight.js" }
    - { code: "api", title: "renderPageHtml",                 sub: "static page html template",         desc: "shared head/body wrapper for kit pages — meta, importmap, ds-247420 scope",                href: "https://github.com/AnEntrypoint/design/blob/main/src/page-html.js",  cta: "page-html.js" }
    - { code: "api", title: "components / motion / debug",    sub: "namespaces from the default export", desc: "components.* are the C.* primitives; motion.animateTree, debug.window.__debug registry",  href: "https://github.com/AnEntrypoint/design/blob/main/src/components.js", cta: "components.js" }

features:
  heading: "why design"
  items:
    - { name: "layered surfaces", desc: "panel-on-panel rhythm; loud content sits inside quiet chrome.", href: "https://github.com/AnEntrypoint/design/blob/main/src/css/app-shell/panel-row.css", cta: "panel-row.css" }
    - { name: "monospace labels", desc: "mono only for codes/labels/CLI; sans for everything legible.", href: "https://github.com/AnEntrypoint/design/blob/main/colors_and_type.css", cta: "colors_and_type.css" }
    - { name: "indicator rails",  desc: "color-coded inset rails for category separation, never borders.", href: "https://github.com/AnEntrypoint/design/blob/main/src/css/app-shell/panel-row.css#L126", cta: "panel-row.css" }
    - { name: "tokens-only",      desc: "every surface, type ramp, accent driven by --panel-* / --fs-* tokens.", href: "https://github.com/AnEntrypoint/design/blob/main/colors_and_type.css", cta: "colors_and_type.css" }

status_left:
  - "main"
  - "utf-8"
  - "lf"
# theme.mjs overwrites this with the real published SDK version + live kit
# count (14 surfaces, from home.kits.items.length) rather than the static
# fallback strings below, which only render if that lookup ever fails.
status_right:
  - "anentrypoint-design"
  - "14 kits"
