    - { code: "md",  title: "Component props", sub: "Generated prop reference", desc: "Every exported component's signature and documented parameters.", href: "https://github.com/AnEntrypoint/design/blob/main/docs/component-props.md" }
    - { code: "live", title: "Component explorer", sub: "Interactive, searchable, live-rendered", desc: "The same 271 components as the reference above, browsable with live specimens — no Storybook, no bundler.", href: "./ui_kits/component_explorer/" }
    - { code: "md",  title: "Changelog", sub: "Release history", desc: "What shipped in each published version.", href: "https://github.com/AnEntrypoint/design/blob/main/CHANGELOG.md" }
