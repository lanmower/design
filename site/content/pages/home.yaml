id: home
title: Home

hero:
  heading: "Design"
  subheading: "The 247420 design system"
  body: "A complete, tokens-driven component system for building consistent, accessible interfaces fast: 15 ready-to-ship kit surfaces, 25 live previews, a slide deck, and a full desktop-shell demo — plus a web component and an SDK. Every panel, row, and form control reads its color, radius, and spacing from one shared token file, so a single theme change updates every surface built on it at once. WCAG AA verified across all 21 kits, zero JavaScript bundler required."
  badges:
    - { label: "Design system" }
    - { label: "Design tokens" }
    - { label: "WCAG AA" }
  ctas:
    - { label: "GitHub", href: "https://github.com/AnEntrypoint/design", primary: true }
    - { label: "247420", href: "https://247420.xyz" }

sidebar:
  fab:
    label: "open"
    glyph: "+"
    href: "./ui_kits/homepage/"
  # `count` here is a fallback only -- site/theme.mjs::withRealCounts()
  # overwrites it at render time from the real kits/decks/previews/docs
  # arrays below for any row whose href is in COUNT_SOURCE_BY_HREF, so a
  # hand-typed number here can never drift out of sync with what the
  # matching panel actually renders.
  bins:
    - { label: "everything", href: "#all", active: true }
    - { label: "pinned",     href: "#kits" }
    - { label: "shipped",    href: "#previews" }
    - { label: "drafts",     href: "#decks" }
  labels_group: "labels"
  labels:
    - { label: "ui kits",  href: "#kits" }
    - { label: "decks",    href: "#decks" }
    - { label: "previews", href: "#previews" }
    - { label: "docs",     href: "#docs" }
  more_group: "more"
  more:
    - { label: "readme",  href: "https://github.com/AnEntrypoint/design/blob/main/README.md" }
    - { label: "skill",   href: "https://github.com/AnEntrypoint/design/blob/main/SKILL.md" }
    - { label: "tokens",  href: "https://github.com/AnEntrypoint/design/blob/main/colors_and_type.css" }
    - { label: "source",  href: "https://github.com/AnEntrypoint/design" }
    - { label: "MIT license", href: "https://github.com/AnEntrypoint/design/blob/main/LICENSE" }

tabs:
  - { label: "everything", href: "#all", active: true }
  - { label: "kits",       href: "#kits" }
  - { label: "decks",      href: "#decks" }
  - { label: "previews",   href: "#previews" }

kits:
  heading: "UI kits"
  count: "15 surfaces"
  items:
    - { code: "01", title: "Homepage",     sub: "Marquee and works grid",                  desc: "An editorial banner over a quiet works-grid shell.",                href: "./ui_kits/homepage/" }
    - { code: "02", title: "Project page", sub: "Hero, receipt, install, changelog",  desc: "A full case-study template for shipping a product story.",                      href: "./ui_kits/project_page/" }
    - { code: "03", title: "Docs",         sub: "Long-form prose chrome",                desc: "Sidebar navigation, mono headings, and code blocks for documentation.",            href: "./ui_kits/docs/" }
    - { code: "04", title: "Blog",         sub: "Dated index and reading view",            desc: "A dated post index with author bylines and a distraction-free reading view.",                            href: "./ui_kits/blog/" }
    - { code: "05", title: "Chat",         sub: "Message thread and composer",             desc: "A message thread with pill bubbles, monospace timestamps, and a room sidebar.",   href: "./ui_kits/chat/" }
    - { code: "06", title: "AICat",        sub: "AI assistant with a character persona",         desc: "An animated ASCII portrait with thinking states and mood changes.",  href: "./ui_kits/aicat/" }
    - { code: "07", title: "File browser", sub: "Type-aware rails, drop zone, preview",   desc: "Every file-row primitive wired to a static demo backed by fsbrowse.", href: "./ui_kits/file_browser/" }
    - { code: "08", title: "Dashboard",    sub: "KPIs, tables, receipts, changelog",  desc: "KPIs, tables, and receipts tracked with a running changelog in one operations surface.", href: "./ui_kits/dashboard/" }
    - { code: "09", title: "Terminal",     sub: "CLI prompt, command lines, log view", desc: "Five line kinds (comment, command, output, ok, warning) over a tonal log panel.", href: "./ui_kits/terminal/" }
    - { code: "10", title: "Settings",     sub: "Sectioned forms, toggles, save bar",  desc: "Every input primitive: fields, segmented buttons, and a danger panel.", href: "./ui_kits/settings/" }
    - { code: "11", title: "Sign in",      sub: "Auth providers and magic link",         desc: "A narrow, tone-on-tone auth form with no shadows and no spinners.", href: "./ui_kits/signin/" }
    - { code: "12", title: "Search",       sub: "Topbar query, faceted filters, rows", desc: "Faceted results ranking, reusing the same RowLink primitive every list uses.", href: "./ui_kits/search/" }
    - { code: "13", title: "404",          sub: "Empty-state hero, suggested routes",   desc: "An oversized mono code with three recovery calls to action.",      href: "./ui_kits/error_404/" }
    - { code: "14", title: "Gallery",      sub: "Visual grid, tonal cards, lightbox",  desc: "Tiles on shared panel tokens that open into a matching lightbox.", href: "./ui_kits/gallery/" }
    - { code: "15", title: "OS shell",     sub: "Menubar, window manager, taskbar", desc: "A runnable desktop-shell demo with its own window manager and app registry.", href: "./ui_kits/os/" }

decks:
  heading: "decks"
  items:
    - { code: "01", title: "deck template", sub: "16:9 stage with auto-fit", desc: "title, lede, code, comparison, manifesto", href: "./slides/" }

docs:
  heading: "docs"
  items:
    - { code: "md",  title: "readme", sub: "overview, manifesto, conventions",   desc: "start here",                          href: "https://github.com/AnEntrypoint/design/blob/main/README.md" }
    - { code: "md",  title: "skill",  sub: "authoring rules for the agent",      desc: "editorial zine surface modes",    href: "https://github.com/AnEntrypoint/design/blob/main/SKILL.md" }
    - { code: "css", title: "tokens", sub: "colors, type, panel surface tokens", desc: "canonical source of truth",           href: "https://github.com/AnEntrypoint/design/blob/main/colors_and_type.css" }
    - { code: "md",  title: "component props", sub: "generated prop reference", desc: "every exported component's signature and documented params", href: "https://github.com/AnEntrypoint/design/blob/main/docs/component-props.md" }
    - { code: "md",  title: "changelog", sub: "release history", desc: "what shipped in each published version", href: "https://github.com/AnEntrypoint/design/blob/main/CHANGELOG.md" }

previews:
