<!doctype html>
<html>
<head><meta charset="utf-8"><title>witness PanelFromItems</title></head>
<body>
<div id="app" class="ds-247420"></div>
<script type="module">
import { installStyles, applyDiff, components as C, h } from '../src/index.js';
await installStyles();
const root = document.getElementById('app');
const items = [
  { name: 'streaming', desc: 'token-by-token output', meta: 'core', href: '#streaming' },
  { title: 'tool use', sub: 'function calling', meta: 'core', href: '#tools' },
  { name: 'caching', href: '#cache' }
];
const view = C.PanelFromItems({ heading: 'features', items, keyPrefix: 'f' });
applyDiff(root, view);
window.__witness = {
  panelPresent: !!root.querySelector('.panel'),
  headTitle: root.querySelector('.panel-head span') ? root.querySelector('.panel-head span').textContent : null,
  rowCount: root.querySelectorAll('.row').length,
  firstRowTitle: root.querySelector('.row .title') ? root.querySelector('.row .title').textContent : null,
  firstRowHref: root.querySelector('a.row') ? root.querySelector('a.row').getAttribute('href') : null,
  secondRowTitleAliasWorks: (function(){ const rows = root.querySelectorAll('.row .title'); return rows[1] ? rows[1].textContent.includes('tool use') : false; })(),
  emptyReturnsNull: C.PanelFromItems({ heading: 'x', items: [] }) === null,
};
document.title = 'witness-ready';
</script>
</body>
</html>
