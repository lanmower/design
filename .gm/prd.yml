- id: browser-verb-literal-colon-breaks-script-body
  subject: The browser verb mis-parses any literal colon in the script body as a prefix separator, breaking most real scripts
  notes: 'Root-caused by bisection this session. browser-7062 with body return "a:b" fails with cdp-eval: exception SyntaxError: Unexpected token 58, while browser-7061 with the identical string built as "a"+String.fromCharCode(58)+"b" returns "a:b" correctly. This is not a syntax error in the caller script -- it is the runner prefix parser splitting the body on the first colon it sees anywhere, including inside a string literal, an object literal (var x={a:1}) or a ternary. It explains every SyntaxError this session: measurement probes containing object literals and https URLs all failed identically. Impact is broad because object literals and URLs are the two most common things in a browser probe. The url= prefix is the sanctioned way to pass a URL (its colon is consumed by the prefix parser before the split), but any colon in the BODY must be constructed via String.fromCharCode(58). Fix belongs in crates/agentplug-host/src/browser.rs prefix parsing: split only on a leading known-prefix token at line start, never on an arbitrary colon inside the body.'
  SESSION_ID: resp-audit-73be7501
  status: pending
- id: kits-aicat-app-surface-fixed
  subject: 'aicat was the single genuine layout defect across all 20 kits: an Operate-mode chat application rendering its page title at the 64px marketing display ceiling; fixed and verified live'
  notes: 'Measured, not inferred. Before: ui_kits/aicat/app.js:163 wrapped the page root in class ds-section (the Read/Persuade root), so the visible h1 rendered 986x77px at font-size 64px -- larger than the assistant name badge and every message bubble in the thread it labels. The squint test against dashboard (which correctly carries .ds-app-surface) made it unambiguous: dashboard squints to its KPI numbers with the title a quiet 30px label, while aicat squinted to the word aicat as the single dominant mass. This is verbatim the failure the CSS comment at src/css/app-shell/kits-appended.css:39 describes -- a display size that makes the page TITLE outweigh the data it labels. Fix is a one-line class change to ds-app-surface ds-section-pad, matching every other Operate kit. After, measured live at 1280x900: h1 978x35px at 30px (identical to dashboard), lede dropped 21px to 16px with a 517px 60ch measure, and the composer moved into the first viewport at y=763 where it had previously been pushed below the 900px fold. Zero horizontal overflow introduced. npm run build passes all 14 gates and npm run lint:ui-kits still reports all 16 thin kits matching generated output, because the edit is in app.js not the generated index.html.'
  SESSION_ID: sess-1785348395335
  status: pending
- id: kits-narrow-fix-8dc7c45-affects-three-kits
  subject: The .app-body.no-side narrow-clamp fix in 8dc7c45 reaches three kits, one more than the two SDK kits passing narrow:true
  notes: 'Verified live rather than assumed. The rule at src/css/app-shell/topbar.css:274 widens .app-main.narrow max-width by --sidebar-width on .app-body.no-side. Measured resolved max-width per kit at 1280x900: signin 980px, error_404 980px, blog 980px (all no-side, so 760+220 applies), versus docs 760px (has a sidebar, correctly unchanged). So blog is a THIRD affected kit beyond the two SDK kits passing narrow:true -- it is hand-authored and not in kits.config.mjs, which is why it was not in the expected set. All three render well inside the new cap with content at 492/669/575px actual width, so nothing is clipped or stretched by the change and no follow-up is needed.'
