- id: kits-fix-absorbed-by-concurrent-writer-commit
  subject: The aicat fix is correct and in HEAD but was absorbed into a concurrent agent commit rather than landing under its own message
  notes: 'Recording the single-writer collision honestly rather than hiding it. This repo had a second agent auditing preview/*.html concurrently on the same branch. My git_add staged ui_kits/aicat/app.js and scripts/lint-inline-styles.baseline.json, but before my git_commit ran, the other writer committed the whole index -- so commit 47f629f, whose message is entirely about preview specimen pages, actually also carries the aicat class change. Verified by git log -S: 47f629f is the commit that introduced ds-app-surface ds-section-pad into ui_kits/aicat/app.js, and git show HEAD:ui_kits/aicat/app.js confirms line 163 carries it. History also moved under me during the session (8dc7c45 became 903fe79, plus a v0.0.416 release commit), which is why the commit hash in earlier notes will not resolve. The CONTENT is correct and verified live post-build; only the attribution is wrong. Deliberately NOT fixed by rewriting shared history, since another agent is actively committing to the same branch and a rebase would race it. Consequence to accept: git archaeology for the aicat heading-scale change will land on a commit message about preview pages.'
  SESSION_ID: sess-1785348395335
  status: completed
  witness: 'Documentation-only row recording a benign attribution quirk, with a deliberate decision NOT to act; re-closing after a concurrent writer replaced .gm/prd.yml wholesale (46 rows -> 4) and reverted it to pending. The substance: the aicat Operate-root fix is correct and present on origin but was absorbed into a concurrent agent''s commit whose message is entirely about preview specimen pages, so git archaeology for that change lands on unrelated prose. Verified independently by reading the file on origin rather than by searching commit subjects -- ui_kits/aicat/app.js carries ''ds-app-surface ds-section-pad'' at line 163 on the remote. The row explicitly records that rewriting shared history to correct attribution was declined on purpose, because another writer was actively committing to the same branch and a rebase would race it -- the same class of destroyed-commit damage documented for agentgui and flatspace. That was the right call and remains so. This turn independently reproduced the same phenomenon twice more, which strengthens rather than changes the conclusion: my own 49-file commit landed under a concurrent writer''s subject line (''feat(theme): restyle to webjsx-toolkit look...''), and this very ledger was replaced from 46 rows to 4 by that writer mid-session. The durable lesson the row states -- in a concurrent-writer environment a commit message is an unreliable index of what a commit contains, so provenance must be answered by reading the file on origin -- is exactly the method I used this turn to confirm all four of my changes (rectOf normalizer, BackfillPanel, AGENTS.md rewrite, CHANGELOG entry) are genuinely on origin/main. No outstanding action.'
  commit_comment: 'chore(prd): re-close the commit-attribution row after a concurrent ledger rewrite reopened it'
