- id: router-error-handling-hardening
  note: '247420/lib/router.js:36 render() does ''if (!component) throw new Error(...)'' and :38 ''if (!root) throw new Error(...)'' -- these throw synchronously from render(), which navigate()/handlePopState() call without a try/catch, meaning an unregistered route or missing #app crashes the whole page with an uncaught exception instead of degrading gracefully (e.g. falling back to a registered 404/default route or a console.error). Harden: accept an optional notFound/fallback route registered like any other, render that instead of throwing when routes.get(name) misses; keep the missing-root case as a thrown error (a real setup bug, not a runtime nav condition) but make it recoverable-diagnosable via debug registry rather than an unhandled throw.'
  status: completed
  witness: 'src/router.js:47-53 render() no longer throws on missing route: falls back to this.fallback if set, else sets state.lastError and returns (diagnosable via debug registry) instead of an uncaught throw. Missing #app root still throws (a real setup bug per the PRD''s own scoping, not a runtime nav condition). Live browser witness (browser-1.json) afterUnregistered: navigate(''nonexistent-route'') renders the NotFound fallback component (''not found: nonexistent-route''), pageErrorsCount:0 -- zero uncaught exceptions, confirmed graceful degradation matching this SDK''s fail-loud-but-recoverable invariant.'
