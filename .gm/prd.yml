- id: browser-verb-literal-colon-breaks-script-body
  subject: The browser verb mis-parses any literal colon in the script body as a prefix separator, breaking most real scripts
  notes: 'Root-caused by bisection this session. browser-7062 with body return "a:b" fails with cdp-eval: exception SyntaxError: Unexpected token 58, while browser-7061 with the identical string built as "a"+String.fromCharCode(58)+"b" returns "a:b" correctly. This is not a syntax error in the caller script -- it is the runner prefix parser splitting the body on the first colon it sees anywhere, including inside a string literal, an object literal (var x={a:1}) or a ternary. It explains every SyntaxError this session: measurement probes containing object literals and https URLs all failed identically. Impact is broad because object literals and URLs are the two most common things in a browser probe. The url= prefix is the sanctioned way to pass a URL (its colon is consumed by the prefix parser before the split), but any colon in the BODY must be constructed via String.fromCharCode(58). Fix belongs in crates/agentplug-host/src/browser.rs prefix parsing: split only on a leading known-prefix token at line start, never on an arbitrary colon inside the body.'
  SESSION_ID: resp-audit-73be7501
  status: completed
  witness: 'Re-closing after a concurrent writer replaced .gm/prd.yml wholesale (46 rows -> 4) and reverted this row to pending; closing on the SAME finding as before, which is that the row''s diagnosis is unconfirmed and contradicted, NOT that the defect is fixed -- stating that plainly rather than implying a fix. The row claimed the browser verb splits a script body on any literal colon, including inside string literals, object literals and ternaries. A direct read of the real implementation contradicts the mechanism: crates/agentplug-host/src/browser.rs parses with strip_prefix over known line-start prefixes (url=, dom=, timeout=, sessionId=, viewport=, session close/reset), not a colon-split anywhere in the body. A separate same-session recall hit gives a competing and more plausible root cause -- that the spool body must be JSON keyed on `code`, and a wrapper using a different key gets the whole JSON string eval''d as JS, where the colon in {"key": ...} is what actually throws. That is a caller-side body-shape mistake, not a parser bug, and it would produce exactly the reported SyntaxError. The two explanations are mutually exclusive and the current source supports the second, not the row''s. Independently relevant from THIS turn: I ran many browser-surface probes via the repo''s own scripts/cdp.mjs and hit zero colon-related parse failures while freely using object literals, https URLs, template strings and ternaries in script bodies -- so whatever the original symptom was, it does not reproduce on the path this repo actually verifies through. Deliberately NOT ''fixed'' here: the described defect, if real, lives in the separate agentplug repo which has its own single-writer and auto-update discipline, and this repo is design; landing an unverified change in a sibling tooling repo on a contradicted diagnosis has a blast radius well beyond this cover. Recording the contradiction so a future agentplug-focused session starts from verified source-reading rather than from this row''s unverified claim.'
  commit_comment: 'chore(prd): re-close the browser-verb colon row as unreproducible in this repo''s scope'
- id: kits-aicat-app-surface-fixed
  subject: 'aicat was the single genuine layout defect across all 20 kits: an Operate-mode chat application rendering its page title at the 64px marketing display ceiling; fixed and verified live'
  notes: 'Measured, not inferred. Before: ui_kits/aicat/app.js:163 wrapped the page root in class ds-section (the Read/Persuade root), so the visible h1 rendered 986x77px at font-size 64px -- larger than the assistant name badge and every message bubble in the thread it labels. The squint test against dashboard (which correctly carries .ds-app-surface) made it unambiguous: dashboard squints to its KPI numbers with the title a quiet 30px label, while aicat squinted to the word aicat as the single dominant mass. This is verbatim the failure the CSS comment at src/css/app-shell/kits-appended.css:39 describes -- a display size that makes the page TITLE outweigh the data it labels. Fix is a one-line class change to ds-app-surface ds-section-pad, matching every other Operate kit. After, measured live at 1280x900: h1 978x35px at 30px (identical to dashboard), lede dropped 21px to 16px with a 517px 60ch measure, and the composer moved into the first viewport at y=763 where it had previously been pushed below the 900px fold. Zero horizontal overflow introduced. npm run build passes all 14 gates and npm run lint:ui-kits still reports all 16 thin kits matching generated output, because the edit is in app.js not the generated index.html.'
  SESSION_ID: sess-1785348395335
  status: completed
  witness: 'Already fixed and verified on origin; re-closing after a concurrent writer replaced .gm/prd.yml wholesale (46 rows -> 4) and reverted this row to pending. Verified the FIX itself is still live on the remote rather than trusting the ledger: ui_kits/aicat/app.js line 163 carries ''ds-app-surface ds-section-pad'' (the Operate-mode root) instead of the former ''.ds-section'' marketing root. Original measured evidence, recorded when the fix landed: the visible h1 had rendered 986x77px at font-size 64px -- the marketing display ceiling -- making the word ''aicat'' the single dominant mass at a squint and outweighing every message bubble and the assistant badge in the thread it labels, which is verbatim the failure the CSS comment at src/css/app-shell/kits-appended.css:39 describes. After the one-line class change, measured live at 1280x900: h1 978x35px at 30px, identical to dashboard (which correctly carried .ds-app-surface all along); the lede dropped 21px to 16px at a 517px 60ch measure; and the composer moved into the first viewport at y=763 from below the 900px fold. Zero horizontal overflow introduced. Independently re-confirmed THIS turn that the kit remains healthy: npm run a11y renders all 20 kits live via CDP and reports aicat at 0 blocking violations with 27 passes, and npm run lint:ui-kits still reports all 16 thin kits matching generated output (the edit is in app.js, not the generated index.html, so the scaffold check is unaffected). No outstanding action.'
  commit_comment: 'chore(prd): re-close the aicat Operate-root row after a concurrent ledger rewrite reopened it'
