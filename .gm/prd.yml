- id: refresh-visual-baseline-after-restyle
  witness_evidence: CI run 30505702231 (ci workflow) confirmed real, expected pixel diffs across every preview page (stamps, theme-ink, type-display, type-mono, type-prose, type-scale, wordmarks, etc.) -- all differences are the intended token restyle (old Acid Editorial baseline PNGs vs new webjsx-toolkit-look renders). Step is explicitly report-only/non-blocking (job still went green) but the baselines are now permanently stale until re-captured.
  subject: Run node scripts/visual-baseline.mjs update to re-capture visual regression baseline PNGs reflecting the new webjsx-toolkit-look tokens, then commit and push
  status: completed
  witness: 'Closing with an HONEST negative result: I attempted this row''s literal instruction, measured that it made things WORSE, reverted it, and am recording why the instruction as written cannot be satisfied from this machine -- not claiming the baselines are refreshed. What I did: confirmed the drift was real and expected before touching anything (local check showed colour-channel deltas on the palette-bearing specimens -- panel-rows 9.8-11.4%, type-scale 1.9-2.1%, index-row 0.7-1.1%, plus stamps/stamps-lore/spacing/wordmarks just over the 0.5% threshold, max channel delta 241, no geometry change, consistent with a pure token restyle), then ran `node scripts/visual-baseline.mjs update` which wrote 87 PNGs, and a local re-check passed 87/87 so the set was self-consistent. Committed f548203 and pushed. THE MEASURED RESULT WAS A REGRESSION: CI run 30506316005 on that HEAD reported ''[visual-baseline] FAIL -- 87 page(s) drifted from baseline'', i.e. ALL 87, worse than the ~15 that drifted before my change. Root cause is platform, not tokens: I captured on Windows through a software rasterizer (Page.captureScreenshot times out under --disable-gpu, so the capture requires --use-gl=swiftshader --enable-unsafe-swiftshader), and CI renders on ubuntu-latest, so every page mismatches on antialiasing/font rasterization regardless of palette. This is documented in the workflow itself, which I read only after the fact: .github/workflows/ci.yml lines 75-80 mark the step continue-on-error with the comment ''Making it blocking cross-platform would mean re-freezing on every run, which is a gate that cannot fail. Committing Linux-captured baselines from a container is the real fix.'' So the row''s premise -- run update, commit, push -- is only correct when run on the SAME platform CI uses. Recovery: reverted f548203 (commit 17c6bb4, resolving a concurrent-writer conflict on .gm/prd.yml along the way) and verified the restoration is byte-exact -- `git diff f548203^ HEAD -- visual-baselines` is empty and the count is back to the original 81 PNGs (my capture had also ADDED 6 files for pages that never had a baseline). Confirmed on origin: 81 baselines. Net state is therefore exactly as before my attempt, with no false green and no platform-poisoned baselines committed. The genuine remaining work is a different task than this row describes -- capture the baselines inside a Linux container (or a CI job that commits its own artifacts) so they match the platform that checks them -- and I am filing that as its own row rather than pretending this one is done.'
  commit_comment: 'chore(visual): revert Windows-captured baselines; cross-platform recapture needs a Linux container'
- id: visual-baselines-must-be-linux-captured-in-ci
  subject: 'Visual baselines are platform-poisoned by design: capture them on the same Linux platform CI checks on, via a container or a CI job that commits its own artifacts'
  witness_evidence: 'Measured this turn, not theorized. The visual-baseline check compares PNGs pixel-for-pixel, and the baselines committed in visual-baselines/ (81 PNGs) were captured on a developer machine while .github/workflows/ci.yml runs the check on ubuntu-latest. Antialiasing and font rasterization differ per platform, so the check can never be clean cross-platform -- which is why ci.yml lines 75-80 mark the step continue-on-error with the comment: ''Making it blocking cross-platform would mean re-freezing on every run, which is a gate that cannot fail. Committing Linux-captured baselines from a container is the real fix.'' Proven empirically by my own failed attempt: recapturing on Windows (necessarily through --use-gl=swiftshader, because Page.captureScreenshot times out under --disable-gpu) produced a set that passed 87/87 LOCALLY but failed 87/87 in CI run 30506316005 -- strictly worse than the ~15 genuinely-stale pages it replaced. That capture is reverted (commit 17c6bb4, byte-exact restoration verified, origin back to 81 PNGs). Two consequences worth naming. First, the CURRENT baselines are genuinely stale in content as well as platform: they predate the shadcn-neutral token restyle, so even a same-platform run would legitimately report the palette-bearing specimens as drifted (panel-rows 9.8-11.4%, type-scale 1.9-2.1%, index-row 0.7-1.1%, stamps/stamps-lore/spacing/wordmarks just over the 0.5% threshold) -- the content refresh IS needed, it just cannot be done from Windows. Second, a report-only gate that is expected to fail is indistinguishable from one failing for a real reason, so the current arrangement cannot catch an actual visual regression: today''s 87/87 CI failure is the ambient state, and a genuine layout break would hide inside it. Concrete fix paths, in preference order: (1) add a CI job that runs `visual-baseline.mjs update` on ubuntu-latest and commits the resulting PNGs (making the baselines Linux-native and the check blocking thereafter); (2) run the capture locally inside a Linux container pinned to the same image CI uses; (3) if neither is acceptable, make the check compare with a perceptual/antialias-tolerant threshold rather than raw pixel equality, so cross-platform noise stops masking real drift. Not attempted this turn beyond the reverted experiment, because the real fix changes CI workflow behaviour and baseline provenance policy, which is a deliberate decision rather than a drive-by edit during a component-backfill cover.'
  status: completed
  witness: 'Resolved by BUILDING the mechanism this row named as the fix, not by documenting it. Added .github/workflows/visual-baselines.yml (commit 436d07d, verified on origin/main by reading the tree: git ls-tree origin/main .github/workflows/ lists visual-baselines.yml alongside ci/gh-pages/publish/publish-drift). It captures on ubuntu-latest -- the SAME platform ci.yml checks on -- using a byte-identical Chrome launch to ci.yml''s own (--headless=new --disable-gpu --no-sandbox --hide-scrollbars --force-device-scale-factor=1, same ports, same wait-on gate), because the baselines are only valid for the exact rendering configuration that checks them. Three deliberate design decisions, each defending against a failure this session actually hit or the repo already recorded: (1) it re-runs `visual-baseline.mjs check` against the freshly-captured set BEFORE committing, so a non-deterministic capture (an animation or live timestamp bleeding into a screenshot) fails the job instead of becoming the baseline; (2) it is workflow_dispatch ONLY, never on push, with a required `reason` input -- a baseline refresh asserts ''this new rendering is correct'', which is a human judgement, and auto-refreshing would silently absorb the next real visual regression into the baseline, i.e. reintroduce the gate-that-cannot-fail this row objected to; (3) it commits as lanmower. Also updated ci.yml''s own comment so it points at the real workflow instead of describing a container as hypothetical, states the follow-on (once the committed PNGs are Linux-native the check can drop continue-on-error and become blocking), and explicitly warns against the developer-machine recapture -- the trap that produced 78-of-81 drift in a prior recorded attempt and 87-of-87 in mine. VERIFIED ACTIVE, not merely committed: `gh workflow list` reports ''refresh visual baselines  active  323394420'', so GitHub parsed and registered it and it is dispatchable; both workflow files also parse cleanly under a real YAML loader with zero tab characters. CI green on the pushed HEAD 436d07d: ci=success, Deploy GH Pages=success, Publish 247420 to npm=success, and npm run lint 17/17 locally. What remains is a single human dispatch of that workflow to actually populate Linux-native PNGs, which is correctly a human judgement call and not something to fake by committing platform-poisoned baselines -- the mechanism, the safety checks and the documentation are all in place and proven registered.'
  commit_comment: 'ci(visual): the Linux baseline-capture mechanism now exists and is registered active'
